name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: python ${{ matrix.python }}, ${{ matrix.search }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        # hybrid downloads the embedding model; words-only never loads it. Both
        # paths ship, so both are tested: the words-only one is what a new user
        # gets until the model is downloaded, and what runs offline.
        search: [hybrid, words-only]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m librarian.validate examples/corpus
      - name: pytest
        run: python -m pytest -q
        env:
          OKF_SEMANTIC: ${{ matrix.search == 'words-only' && '0' || '' }}
