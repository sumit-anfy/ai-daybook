# Retrieval benchmark — a fixed query set over the EXAMPLE corpus (examples/corpus).
#
# Measures top-1 / top-5 retrieval against (query, expected-node) pairs, and the
# intent classifier on its own. test_benchmark_floor holds the ranking floors
# (it runs only with the semantic layer installed); test_intent_misroute_ceiling
# caps classifier misroutes. `python tests/retrieval_report.py` prints the full
# picture.
#
# About a third of the queries avoid the target's own words (note: paraphrase):
# those measure what the embedding layer adds over word matching.
#
# Entry shape:
#   query:    what a person would type
#   expected: the node id a correct retrieval ranks at or near the top
#   intent:   current_ruling | project_state | procedure | record | history |
#             open_question | reference — or a LIST of acceptable labels, where
#             null means abstaining is fine
#   note:     optional; "paraphrase" marks a query in other words than the node's
#   also_accept: optional further ids that answer the question as well

benchmark:
