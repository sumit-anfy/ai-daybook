# Findability seed bank — held-out stranger questions over the EXAMPLE corpus.
#
# Can a person who has forgotten a node's wording still reach it? Twenty live
# nodes, two queries each, written from the body alone without reusing the
# node's title, summary, tags or `asks`:
#
#   stranger  a 6-12 word everyday question about what the node is mainly for
#   short     a 2-5 word phrase typed in a hurry
#
# librarian/findability.py runs this bank weekly inside the HTTP service and
# writes the counts to a log node; tests/retrieval_report.py prints it on demand.

findability:
