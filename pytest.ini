[pytest]
# -rs prints the REASON for every skip. Since the 2026-08-01 code/corpus split the
# Mac holds no nodes, so the corpus-dependent tests skip there — and a bare
# "1 skipped" hides that 94 tests did not run. Whoever reads the output must be
# told what was not checked, or the silence reads as coverage
# (the fail-loudly rule).
addopts = -rs
testpaths = tests
